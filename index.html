<script>

const fit = document.getElementById("fit");
function fitStage(){
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * s) / 2;
        const y = (window.innerHeight - 1080 * s) / 2;
        fit.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
fitStage();
window.onresize = fitStage;

const SONGS = {
        opening: "VxEO871bUU8",
        main:    "iurpqcZLXiU",
        slow:    "gyvdrSWwwYQ",
        ending:  "tjWHHyHdbbE"
};
const FILES = {
        opening: "dancing cyboge.mp3",
        main:    "newworld.mp3",
        slow:    "borning of syboge.mp3",
        ending:  "sundeasong.mp3"
};
const audios = {};
const audioOk = {};
for (const name in FILES){
        const a = new Audio();
        a.loop = true;
        a.preload = "auto";
        a.addEventListener("canplay", function(){
                audioOk[name] = true;
                if (wantSong === name && !muted && a.paused) playSong(name, false);
        });
        a.addEventListener("error", function(){ audioOk[name] = false; });
        a.src = FILES[name];
        audios[name] = a;
}
function fadeAudio(a, to, ms){
        const from = a.volume;
        let step = 0;
        const n = 12;
        const t = setInterval(function(){
                step++;
                a.volume = Math.max(0, Math.min(1, from + (to - from) * step / n));
                if (step >= n) clearInterval(t);
        }, ms / n);
}
const players = {};
const ready = {};
let wantSong = "";
let muted = false;

function onYouTubeIframeAPIReady(){
        for (const name in SONGS){
                makePlayer(name);
        }
}
function makePlayer(name){
        players[name] = new YT.Player("yt_" + name, {
                width: 200, height: 200, videoId: SONGS[name],
                playerVars: { controls: 0, playsinline: 1, rel: 0, disablekb: 1 },
                events: {
                        onReady: function(){
                                ready[name] = true;
                                if (wantSong === name && !muted) playSong(name, false);
                        },
                        onStateChange: function(e){
                                if (e.data === 0 && wantSong === name && !muted){
                                        e.target.seekTo(0);
                                        e.target.playVideo();
                                }
                        }
                }
        });
}
function playSong(name, fromStart){
        if (audioOk[name]){
                const a = audios[name];
                if (fromStart) a.currentTime = 0;
                a.volume = 0;
                const pr = a.play();
                if (pr && pr.catch) pr.catch(function(){});
                fadeAudio(a, 1, 600);
                return;
        }
        const p = players[name];
        if (!p || !ready[name]) return;
        try {
                if (fromStart) p.seekTo(0);
                p.setVolume(0);
                p.playVideo();
                fadeVolume(p, 0, 100, 600);
        } catch (e) {}
}
function fadeVolume(p, from, to, ms){
        let step = 0;
        const n = 12;
        const t = setInterval(function(){
                step++;
                try { p.setVolume(from + (to - from) * step / n); } catch (e) {}
                if (step >= n) clearInterval(t);
        }, ms / n);
}
function pauseSong(name){
        if (audios[name]) audios[name].pause();
        const p = players[name];
        if (!p || !ready[name]) return;
        try { p.pauseVideo(); } catch (e) {}
}
function bgm(name, fromStart){
        wantSong = name;
        muted = false;
        for (const k in SONGS){
                if (k !== name) pauseSong(k);
        }
        playSong(name, fromStart);
}
function bgmStop(){
        muted = true;
        for (const k in SONGS) pauseSong(k);
}
document.addEventListener("click", function(){
        if (wantSong && !muted && audioOk[wantSong] && audios[wantSong].paused){
                const pr = audios[wantSong].play();
                if (pr && pr.catch) pr.catch(function(){});
        }
        if (wantSong && !muted && players[wantSong] && ready[wantSong]){
                try {
                        if (players[wantSong].getPlayerState() !== 1) players[wantSong].playVideo();
                } catch (e) {}
        }
});

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
}
function nameI(name){
        const c = name.charCodeAt(name.length - 1) - 0xAC00;
        const hasBatchim = (c >= 0 && c <= 11171) && (c % 28 !== 0);
        return name + (hasBatchim ? "이" : "");
}
function callName(name){
        const c = name.charCodeAt(name.length - 1) - 0xAC00;
        const hasBatchim = (c >= 0 && c <= 11171) && (c % 28 !== 0);
        return name + (hasBatchim ? "아" : "야");
}
function seatTransform(npc, seat, extraX){
        const cx = (npc.x0 + npc.x1) / 2 * (1920 / 1366);
        const top = npc.y0 * (1080 / 768);
        const tx = seat.cx - cx * seat.s + (extraX || 0);
        const ty = seat.top - top * seat.s;
        return "translate(" + tx + "px," + ty + "px) scale(" + seat.s + ")";
}

function makeQuestions(){
        const used = {};
        queue.forEach(function(n){
                const list = QUESTIONS.filter(function(q){
                        return q.n === n.gender && (q.who === "any" || q.who === playerGender) && !used[q.a];
                });
                n.q = pick(list);
                used[n.q.a] = true;
        });
        queue.forEach(function(n, k){ n.scene = SCENES[k]; });
}

function makeChoices(q){
        const seen = {};
        const pool = [];
        QUESTIONS.forEach(function(x){
                if (x.n === q.n && x.a !== q.a && (x.who === "any" || x.who === playerGender) && !seen[x.a]){
                        seen[x.a] = true;
                        pool.push(x.a);
                }
        });
        const hardPool = pool.filter(function(t){ return HARD.indexOf(t) !== -1; });
        const d1 = pick(hardPool.length > 0 ? hardPool : pool);
        const rest = pool.filter(function(t){ return t !== d1; });
        const d2 = pick(rest);
        return shuffle([q.a, d1, d2]);
}

function layoutNpcs(){
        for (let i = 0; i < queue.length; i++){
                const n = queue[i];

                if (rel < 0) continue;
                if (rel < 3){
                        n.el.style.opacity = 1;
                        n.el.style.zIndex = SEATS[rel].z;
                        n.el.style.transform = seatTransform(n, SEATS[rel], 0);
                } else {
                        n.el.style.opacity = 0;
                        n.el.style.transform = seatTransform(n, SEATS[2], 900);
                }
        }
}

                const mine = (playerGender === "m") ? "men" : "women";
                const her = (n.gender === "m") ? "men" : "women";
                const res = n.right ? "ok" : "no";
                const note = n.name + (n.right ? "" : "<br>내 대답 : " + n.myAnswer);
                html += '<div class="panel" style="left:' + (x - 20) + 'px; top:' + (y - 35) + 'px;"><div class="num">' + (i + 1) + '</div></div>'
                      + '<div class="pair" style="left:' + x + 'px; top:' + y + 'px;">'
                      + '<div class="icon me ' + mine + '"></div>'
                      + '<div class="link">' + n.q.hint.replace("내 ", "") + '<i></i></div>'
                      + '<div class="icon her ' + her + '"><div class="badge ' + res + '">' + (n.right ? "O" : "X") + '</div></div>'
                      + '<div class="chip chipMe">나 · ' + playerName + '</div>'
                      + '<div class="chip chipAns ' + res + '">정답 ' + n.q.a + '</div>'
                      + '<div class="note">' + note + '</div>'
                      + '</div>';
        }
        pairs.innerHTML = html;
}

retryHit.onclick = function(){
        if (step !== "end") return;
        step = "retrying";
        fade.style.transition = "opacity 1.2s ease";
        fade.style.opacity = 1;
        setTimeout(function(){
                resetGame();
                fade.style.transition = "opacity 1.2s ease";
                fade.style.opacity = 0;
        }, 1300);
};

function resetGame(){
        room.classList.add("down");
        setTimeout(function(){ room.classList.remove("down"); }, 900);
        ending.style.display = "none";
        room.style.display = "block";
        game.style.transition = "none";
        game.style.filter = "none";
        scene.style.transition = "none";
        scene.style.transform = "scale(1)";
        queue.forEach(function(n){ n.el.style.opacity = 0; });
        money.style.opacity = 0;
        gQuiz.classList.remove("on");
        gTalk.classList.remove("on");
        gReply.classList.remove("on");
        gGender.classList.remove("on");
        gName.classList.remove("on");
        gIntro.classList.add("on");
        chatbox.style.opacity = 1;
        chatHit.style.display = "block";
        nameInput.value = "";
        playerGender = "";
        playerName = "";
        slowMode = false;
        frozen = false;
        answered = false;
        setPlayer("f");
        step = "intro";
        bgm("opening", true);
}
</script>
